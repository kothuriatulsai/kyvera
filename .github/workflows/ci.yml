name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    env:
      # Tests manage this database entirely themselves (create, migrate,
      # truncate, seed - see apps/api/tests/globalSetup.ts), the same way a
      # local `npm test` does; nothing else in this job needs a database.
      TEST_DATABASE_URL: postgresql://kyvera:kyvera@localhost:5432/kyvera_test?schema=public
      # Needed at install time too: `npm ci` runs `prisma generate` (postinstall),
      # and prisma.config.ts requires DATABASE_URL to load. Points at the same
      # throwaway test database; nothing in CI uses a dev database.
      DATABASE_URL: postgresql://kyvera:kyvera@localhost:5432/kyvera_test?schema=public
      # Throwaway values: CI only needs *a* valid secret/password, and no real
      # one should ever live in the workflow file.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      SEED_USER_PASSWORD: ci-only-seed-password-not-used-anywhere-else
      # The Playwright smoke test logs in with this same seeded user/password.
      E2E_PMO_EMAIL: pmo@kyvera.dev
      E2E_PMO_PASSWORD: ci-only-seed-password-not-used-anywhere-else
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kyvera
          POSTGRES_PASSWORD: kyvera
          POSTGRES_DB: kyvera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyvera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test the compiled API
        # Catches the class of bug where every package typechecks and every
        # test passes (tsx/vitest/Vite all transform TS on the fly, so they
        # never hit this) but the actual compiled output can't start - e.g.
        # apps/api requiring a workspace dependency whose package.json points
        # at TS source instead of built JS. Node refuses to type-strip a .ts
        # file found in node_modules, so that only ever surfaces here, against
        # the real `node dist/index.js`.
        run: |
          node apps/api/dist/index.js > api-smoke.log 2>&1 &
          API_PID=$!

          READY=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              READY=true
              break
            fi
            sleep 1
          done

          kill "$API_PID" 2>/dev/null || true

          if [ "$READY" != "true" ]; then
            echo "Compiled API never responded 200 on /health - server output:"
            cat api-smoke.log
            exit 1
          fi
          echo "Compiled API started from dist/ and /health returned 200"

      - name: Test
        run: npm run test

      - name: Seed users for the Playwright smoke test
        # `npm run test` truncates kyvera_test and reseeds nothing
        # (apps/api/tests/globalSetup.ts) - the dev user list (pmo@, etc.) has
        # to come back separately, now, for the browser test below to log in
        # as one.
        run: npm run db:seed --workspace apps/api

      - name: Playwright smoke test
        # A real browser, against the actual built web app (vite preview) and
        # the actual compiled API (dist/index.js) - the two already proven to
        # build correctly above, now proven to work *together*: log in, reach
        # a real page, no blank screen and no CORS surprise.
        run: |
          CORS_ALLOWED_ORIGINS=http://localhost:4173 node apps/api/dist/index.js > api-e2e.log 2>&1 &
          API_PID=$!
          npm run preview --workspace apps/web -- --port 4173 --strictPort > web-e2e.log 2>&1 &
          WEB_PID=$!

          READY=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null && curl -sf http://localhost:4173/ > /dev/null; then
              READY=true
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "API or web preview never came up:"
            echo "--- api-e2e.log ---"; cat api-e2e.log
            echo "--- web-e2e.log ---"; cat web-e2e.log
            kill "$API_PID" "$WEB_PID" 2>/dev/null || true
            exit 1
          fi

          # `set -e` is on by default for GitHub Actions' bash steps, which
          # would skip the kill/exit below on a Playwright failure - turned
          # off for just this one command so cleanup always runs.
          set +e
          npm run test:e2e --workspace e2e
          PLAYWRIGHT_STATUS=$?
          set -e

          kill "$API_PID" "$WEB_PID" 2>/dev/null || true
          exit $PLAYWRIGHT_STATUS

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
