name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://kyvera:kyvera@localhost:5432/kyvera?schema=public
      # Throwaway value: CI only needs *a* valid secret (32+ chars), and no
      # real one should ever live in the workflow file.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kyvera
          POSTGRES_PASSWORD: kyvera
          POSTGRES_DB: kyvera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyvera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply Prisma migrations
        run: npm run db:deploy --workspace apps/api

      - name: Seed database
        run: npm run db:seed --workspace apps/api

      - name: Test
        run: npm run test
