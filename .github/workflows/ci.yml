name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    env:
      # Tests manage this database entirely themselves (create, migrate,
      # truncate, seed - see apps/api/tests/globalSetup.ts), the same way a
      # local `npm test` does; nothing else in this job needs a database.
      TEST_DATABASE_URL: postgresql://kyvera:kyvera@localhost:5432/kyvera_test?schema=public
      # Needed at install time too: `npm ci` runs `prisma generate` (postinstall),
      # and prisma.config.ts requires DATABASE_URL to load. Points at the same
      # throwaway test database; nothing in CI uses a dev database.
      DATABASE_URL: postgresql://kyvera:kyvera@localhost:5432/kyvera_test?schema=public
      # Throwaway value: CI only needs *a* valid secret (32+ chars), and no
      # real one should ever live in the workflow file.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kyvera
          POSTGRES_PASSWORD: kyvera
          POSTGRES_DB: kyvera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyvera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test the compiled API
        # Catches the class of bug where every package typechecks and every
        # test passes (tsx/vitest/Vite all transform TS on the fly, so they
        # never hit this) but the actual compiled output can't start - e.g.
        # apps/api requiring a workspace dependency whose package.json points
        # at TS source instead of built JS. Node refuses to type-strip a .ts
        # file found in node_modules, so that only ever surfaces here, against
        # the real `node dist/index.js`.
        run: |
          node apps/api/dist/index.js > api-smoke.log 2>&1 &
          API_PID=$!

          READY=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              READY=true
              break
            fi
            sleep 1
          done

          kill "$API_PID" 2>/dev/null || true

          if [ "$READY" != "true" ]; then
            echo "Compiled API never responded 200 on /health - server output:"
            cat api-smoke.log
            exit 1
          fi
          echo "Compiled API started from dist/ and /health returned 200"

      - name: Test
        run: npm run test
